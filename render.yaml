services:
  - type: web
    name: dasma-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && cd apps/api && npx prisma generate && npx nest build && ls -la dist && test -f dist/main.js
    startCommand: node scripts/start-api.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        value: kosovarepublik99
      - key: EVENT_CODE
        value: wedding
      - key: EVENT_TITLE
        value: Drenusha & Egzon
      - key: MAX_CONCURRENT_UPLOADS
        value: "6"
      - key: MAX_VIDEO_BYTES
        value: "209715200"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: UPLOAD_DIR
        value: /opt/render/project/src/data/uploads
      - key: DATABASE_URL
        value: file:/opt/render/project/src/data/dregz.db
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_WEB_URL
        value: https://dasma-drenushes-dhe-egzonit.vercel.app
      - key: CORS_ORIGIN
        value: https://dasma-drenushes-dhe-egzonit.vercel.app
      - key: PUBLIC_API_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
