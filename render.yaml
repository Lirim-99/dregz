services:
  - type: web
    name: dasma-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: starter
    healthCheckPath: /api/events/wedding
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: DATABASE_URL
        value: file:/data/dregz.db
      - key: ADMIN_PASSWORD
        value: kosovarepublik99
      - key: EVENT_CODE
        value: wedding
      - key: EVENT_TITLE
        value: Drenusha & Egzon
      - key: MAX_CONCURRENT_UPLOADS
        value: "6"
      - key: MAX_VIDEO_BYTES
        value: "209715200"
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_WEB_URL
        value: https://dasma-drenushes-dhe-egzonit.vercel.app
      - key: CORS_ORIGIN
        value: https://dasma-drenushes-dhe-egzonit.vercel.app,https://dasma-drenushes-dhe-egzonit-lirim-hasanis-projects.vercel.app
      - key: PUBLIC_API_URL
        sync: false
    disk:
      name: dasma-data
      mountPath: /data
      sizeGB: 10
